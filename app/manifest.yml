# On-Call Memory — Forge manifest.
# Panel = Custom UI (plain DOM + esbuild bundle), NOT UI Kit: see HANDOFF decision 1.
# Check before every deploy:  npm run check   (npm test && forge lint)
app:
  id: ari:cloud:ecosystem::app/d0c1b623-3512-4219-8760-0b15e2bd80b2
  runtime:
    name: nodejs24.x
    memoryMB: 256

modules:
  jira:issuePanel:
    - key: oncall-memory-panel
      title: On-Call Memory
      icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%230052CC' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%230052CC'/%3E%3C/svg%3E"
      resource: oncall-panel
      resolver:
        function: panel-resolver-fn

  function:
    - key: panel-resolver-fn
      handler: resolvers.panelData
    - key: who-knows-fn
      handler: handlers.whoKnows
    - key: memory-card-fn
      handler: handlers.memoryCard
    - key: radar-fn
      handler: handlers.onIssueCreated

  action:
    - key: who-knows
      name: Who knows about this
      function: who-knows-fn
      actionVerb: GET
      description: >
        Return up to three people with real evidence of having solved this kind
        of problem, each with the issue keys, pages and dates that prove it. Use
        when a user asks who to talk to about an issue, an incident or a
        component.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: Jira issue key, e.g. OPS-123

    - key: has-happened-before
      name: Has this happened before
      function: memory-card-fn
      actionVerb: GET
      description: >
        Return up to five past issues that describe the same problem as the
        given text or issue, with how each was resolved and by whom. Use before
        starting work on an incident or a bug report.
      inputs:
        text:
          title: Problem description
          type: string
          required: false
          description: Free-text description of the problem
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Existing Jira issue to use as the query instead of text

  rovo:skill:
    - key: oncall-memory
      # SKILL.md tells the agent when to call which action and how to read the receipts.
      source:
        dir: src/skills/oncall-memory
      dependencies:
        tools:
          - who-knows
          - has-happened-before

  # P5: the agent. Read-only: it can only reach the two actions above, through the skill.
  rovo:agent:
    - key: oncall-memory-agent
      name: On-Call Memory
      description: Finds who has actually solved this kind of Jira problem, with the issue keys that prove it.
      prompt: |
        You are On-Call Memory for this Jira project. You answer one question: who
        should be asked about a problem, based on what people have actually done.

        Use the oncall-memory skill whenever someone asks who to ask about an issue,
        who knows about a component, or whether something has happened before.

        Never name a person who is not in the tool output, and never cite an issue
        key the tool did not return. Every name carries at least one receipt key.
        If the tools return nothing, say there are no receipts and what was searched
        — an empty answer with a scope is worth more than a plausible guess.
      conversationStarters:
        - Who should I ask about this issue?
        - Has this happened before?
      skills:
        - oncall-memory

  rovo:mcp:
    - key: oncall-memory-mcp
      name: On-Call Memory
      tools:
        - who-knows
        - has-happened-before

  # P4: the judge. Adding this module is a MAJOR version bump — admins must approve the
  # upgrade, and every token is billed to this Developer Space (no free allowance).
  llm:
    - key: oncall-judge
      model:
        - claude

  trigger:
    - key: issue-created-radar
      function: radar-fn
      events:
        - avi:jira:created:issue
      filter:
        ignoreSelf: true

resources:
  - key: oncall-panel
    path: src/frontend/panel

permissions:
  scopes:
    - read:jira-work
    # write: exactly one comment on a newly created issue (the radar). Nothing else writes.
    - write:jira-work
    # read:graph:jira is deliberately NOT declared yet: the Teamwork Graph query lands in P4,
    # and declaring an unused TWG scope would force judges through an org-admin install.
