# On-Call Memory — Forge manifest (v0, backend only).
# The panel lands in P2 with the `forge create` UI Kit toolchain, so its resource path
# is not invented here. Validate before every deploy:  ./validate-manifest.py
app:
  id: ari:cloud:ecosystem::app/d0c1b623-3512-4219-8760-0b15e2bd80b2
  runtime:
    name: nodejs24.x
    memoryMB: 256

modules:
  function:
    - key: who-knows-fn
      handler: handlers.whoKnows
    - key: memory-card-fn
      handler: handlers.memoryCard
    - key: radar-fn
      handler: handlers.onIssueCreated

  action:
    - key: who-knows
      name: Who knows about this
      function: who-knows-fn
      actionVerb: GET
      description: >
        Return up to three people with real evidence of having solved this kind
        of problem, each with the issue keys, pages and dates that prove it. Use
        when a user asks who to talk to about an issue, an incident or a
        component.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: Jira issue key, e.g. OPS-123

    - key: has-happened-before
      name: Has this happened before
      function: memory-card-fn
      actionVerb: GET
      description: >
        Return up to five past issues that describe the same problem as the
        given text or issue, with how each was resolved and by whom. Use before
        starting work on an incident or a bug report.
      inputs:
        text:
          title: Problem description
          type: string
          required: false
          description: Free-text description of the problem
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Existing Jira issue to use as the query instead of text

  rovo:mcp:
    - key: oncall-memory-mcp
      name: On-Call Memory
      tools:
        - who-knows
        - has-happened-before

  trigger:
    - key: issue-created-radar
      function: radar-fn
      events:
        - avi:jira:created:issue
      filter:
        ignoreSelf: true

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    # write: exactly one comment on a newly created issue (the radar). Nothing else writes.
    - write:jira-work
    # read:graph:jira is deliberately NOT declared yet: the Teamwork Graph query lands in P4,
    # and declaring an unused TWG scope would force judges through an org-admin install.
